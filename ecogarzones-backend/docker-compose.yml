services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecogarzones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    depends_on: [db]
    environment:
      DB_URL: jdbc:postgresql://db:5432/ecogarzones
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8080:8080"]
volumes:
  pgdata:
